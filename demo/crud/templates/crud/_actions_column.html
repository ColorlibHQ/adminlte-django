{% load i18n %}
{% if perms.crud.change_contact or perms.crud.delete_contact %}
<div class="btn-group btn-group-sm" role="group">
  {% if perms.crud.change_contact %}<a href="{% url 'crud:contact_update' record.pk %}" class="btn btn-outline-primary" title="{% trans 'Edit' %}" aria-label="{% trans 'Edit' %}"><i class="bi bi-pencil"></i></a>{% endif %}
  {% if perms.crud.delete_contact %}<a href="{% url 'crud:contact_delete' record.pk %}" class="btn btn-outline-danger" title="{% trans 'Delete' %}" aria-label="{% trans 'Delete' %}"><i class="bi bi-trash"></i></a>{% endif %}
</div>
{% endif %}
