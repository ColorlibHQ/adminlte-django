{% load allauth %}
<form method="{{ attrs.method|default:'post' }}"{% if attrs.action %} action="{{ attrs.action }}"{% endif %}{% if attrs.id %} id="{{ attrs.id }}"{% endif %}{% if attrs.enctype %} enctype="{{ attrs.enctype }}"{% endif %} novalidate>
    {% slot body %}{% endslot %}
    {% if slots.actions %}
        <div class="d-grid gap-2 mt-3">
            {% slot actions %}{% endslot %}
        </div>
    {% endif %}
</form>
