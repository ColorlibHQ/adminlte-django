{% extends "adminlte/auth/auth-master.html" %}
{% load i18n %}
{% block auth_body %}
  <p class="login-box-msg">{% trans 'Forgot your password? Enter your email and we will send a reset link.' %}</p>
  <form method="post">{% csrf_token %}
    {% include "adminlte/auth/_form.html" %}
    <button type="submit" class="btn btn-primary w-100">{% trans 'Send reset link' %}</button>
  </form>
  <p class="mt-3 mb-0"><a href="{% url 'login' %}">{% trans 'Back to sign in' %}</a></p>
{% endblock %}
