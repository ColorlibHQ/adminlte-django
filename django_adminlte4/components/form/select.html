<div class="mb-3 {{ fgroup_class }}">
    {% if label %}<label for="{{ id }}" class="form-label">{{ label }}</label>{% endif %}
    <select name="{{ name }}" id="{{ id }}" class="{{ control_class }}"{% if multiple %} multiple{% endif %}{{ attrs }}>
        {% slot "default" default %}{% endslot %}
    </select>
    {% if has_error %}<div class="invalid-feedback d-block">{{ error_message }}</div>{% endif %}
</div>
