<div class="{{ alert_class }}"{{ attrs }} role="alert">
    {% if icon %}<i class="{{ icon }} me-1"></i>{% endif %}{% if title %}<h5 class="alert-heading d-inline">{{ title }}</h5>{% endif %}
    {% slot "default" default %}{% endslot %}
    {% if dismissable %}<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>{% endif %}
</div>
