<div class="{{ box_class }}"{{ attrs }}>
    <div class="inner">
        <h3>{{ title }}</h3>
        {% if text %}<p>{{ text }}</p>{% endif %}
        {% slot "default" default %}{% endslot %}
    </div>
    {% if icon %}<i class="small-box-icon {{ icon }}" aria-hidden="true"></i>{% endif %}
    {% if url %}
        <a href="{{ url }}" class="small-box-footer link-light link-underline-opacity-0 link-underline-opacity-50-hover">
            {{ url_text }} <i class="bi bi-link-45deg"></i>
        </a>
    {% endif %}
</div>
