<div id="{{ id }}" class="{{ toast_class }}" role="alert" aria-live="assertive" aria-atomic="true"
     {% if autohide %}data-bs-autohide="true" data-bs-delay="{{ delay }}"{% else %}data-bs-autohide="false"{% endif %}{{ attrs }}>
    <div class="d-flex">
        <div class="toast-body">
            {% if icon %}<i class="{{ icon }} me-2"></i>{% endif %}{% if title %}<strong>{{ title }}</strong>{% if not icon %}<br>{% endif %}{% endif %}
            {% slot "default" default %}{% endslot %}
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
</div>
